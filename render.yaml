services:
  - type: web
    name: prophr-api
    runtime: node
    rootDir: .
    buildCommand: cd backend && npm install && cd ../frontend && npm install && npm run build
    startCommand: cd backend && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://hrpropninja.com,https://www.hrpropninja.com,https://api.hrpropninja.com
