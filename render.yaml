services:
  - type: web
    name: prophr-api
    runtime: node
    rootDir: .
    buildCommand: npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://hrpropninja.com,https://www.hrpropninja.com,https://api.hrpropninja.com
